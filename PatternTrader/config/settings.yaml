application:
  name: "PatternTrader"
  version: "0.1.0"
  debug: false
  environment: "development"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: true

database:
  host: "localhost"
  port: 5432
  name: "pattern_trader"
  user: "postgres"
  password: "${DB_PASSWORD}"
  pool_size: 20
  max_overflow: 10
  echo: false

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} - {message}"
  rotation: "100 MB"
  retention: "30 days"
  compression: "gz"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  enabled: false

data_providers:
  default: "binance"
  binance:
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    testnet: true
  bybit:
    api_key: "${BYBIT_API_KEY}"
    api_secret: "${BYBIT_API_SECRET}"
    testnet: true
  yahoo:
    enabled: true

market:
  default_timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"
  default_symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "BNBUSDT"
  indicators:
    ema_periods: [9, 21, 50, 100, 200]
    sma_periods: [20, 50, 100, 200]
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    atr_period: 14
    bb_period: 20
    bb_std: 2.0
    vwap_enabled: true

patterns:
  scoring:
    min_score_to_observe: 60
    min_score_to_prepare: 75
    min_score_to_alert: 85
    min_score_to_send: 95
  lifecycle:
    check_interval_seconds: 5
    max_patterns_per_symbol: 50
  health:
    recalculate_interval_seconds: 10

scoring:
  weights:
    pattern_structure: 0.35
    volume: 0.20
    momentum: 0.10
    atr: 0.10
    rsi: 0.10
    macd: 0.05
    ema: 0.05
    ml_history: 0.05

risk:
  max_risk_per_trade: 0.02
  max_daily_risk: 0.06
  max_exposure_per_asset: 0.10
  max_correlated_exposure: 0.15
  default_rr_ratio: 2.0
  trailing_stop_enabled: false

backtesting:
  default_initial_capital: 100000
  default_commission: 0.001
  default_slippage: 0.0005
  walk_forward_splits: 5
  monte_carlo_simulations: 1000

ml:
  model_path: "./models/"
  training_data_path: "./data/training/"
  models:
    random_forest:
      n_estimators: 100
      max_depth: 10
    xgboost:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
    lightgbm:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
    lstm:
      sequence_length: 60
      hidden_size: 128
      num_layers: 2
      dropout: 0.2
