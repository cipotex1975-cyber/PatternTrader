application:
  name: "PatternTrader"
  version: "0.1.0"
  debug: false
  environment: "development"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: true

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} - {message}"
  rotation: "100 MB"
  retention: "30 days"
  compression: "gz"
  trades_rotation: "1 day"
  trades_retention: "90 days"

market:
  default_timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"
  default_symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "BNBUSDT"
  indicators:
    ema_periods: [9, 21, 50, 100, 200]
    sma_periods: [20, 50, 100, 200]
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    atr_period: 14
    bb_period: 20
    bb_std: 2.0
    vwap_enabled: true
    momentum_period: 10

  structure:
    pivot_lookback: 2
    fractal_window: 2
    zigzag_threshold: 0.03
    zigzag_atr_multiplier: 1.5
    trend_min_pivots: 2
    trend_strength_lookback: 5
    channel_slope_tolerance: 0.15

patterns:
  scoring:
    min_score_to_observe: 60
    min_score_to_prepare: 75
    min_score_to_alert: 85
    min_score_to_send: 95
    cooldown_minutes: 5
    signal_ttl_hours: 24
  lifecycle:
    enabled: true
    check_interval_seconds: 5
    max_patterns_per_symbol: 50
    timeframes: ["15m", "1h", "4h"]
    candle_limit: 500
  health:
    recalculate_interval_seconds: 10
  detection:
    peak_tolerance: 0.02
    flag_slope_tolerance: 0.001
  confirmation:
    max_spread_ratio: 0.001

strategies:
  enabled:
    - "trend_follow"
    - "breakout"
    - "contrarian"
  params: {}

scoring:
  weights:
    pattern_structure: 0.35
    volume: 0.20
    momentum: 0.10
    atr: 0.10
    rsi: 0.10
    macd: 0.05
    ema: 0.05
    ml_history: 0.05

risk:
  max_risk_per_trade: 0.02
  max_daily_risk: 0.06
  max_exposure_per_asset: 0.10
  max_correlated_exposure: 0.15
  default_rr_ratio: 2.0
  trailing_stop_enabled: false
  symbol_sectors:
    BTCUSDT: "crypto"
    ETHUSDT: "crypto"
    BNBUSDT: "crypto"
  correlations:
    BTCUSDT:
      ETHUSDT: 0.85
      BNBUSDT: 0.75
    ETHUSDT:
      BTCUSDT: 0.85
    BNBUSDT:
      BTCUSDT: 0.75

backtesting:
  default_initial_capital: 100000
  default_commission: 0.001
  default_slippage: 0.0005
  default_max_positions: 10
  walk_forward_splits: 5
  monte_carlo_simulations: 1000

ml:
  model_path: "./models/"
  training_data_path: "./data/training/"
  models:
    random_forest:
      n_estimators: 100
      max_depth: 10
    xgboost:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
    lightgbm:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
    lstm:
      sequence_length: 60
      hidden_size: 128
      num_layers: 2
      dropout: 0.2
