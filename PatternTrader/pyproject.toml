[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pattern-trader"
version = "0.1.0"
description = "Professional chart pattern detection and trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PatternTrader Team"}
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.25.0",
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "numpy>=1.26.2",
    "scipy>=1.12.0",
    "pandas>=2.1.4",
    "ta>=0.11.0",
    "scikit-learn>=1.3.2",
    "xgboost>=2.0.3",
    "lightgbm>=4.2.0",
    "catboost>=1.2.2",
    "torch>=2.1.0",
    "aiohttp>=3.9.1",
    "websockets>=12.0",
    "ccxt>=4.2.0",
    "yfinance>=0.2.33",
    "httpx>=0.25.2",
    "python-telegram-bot>=20.7",
    "plotly>=5.18.0",
    "dash>=2.14.2",
    "schedule>=1.2.1",
    "joblib>=1.3.2",
    "optuna>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "isort>=5.13.0",
    "mypy>=1.7.1",
    "flake8>=7.0.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]
